# R CMD check via GitHub Actions
# Runs on every push and PR to ensure package integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::yaml
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # Drop --as-cran: it runs tests in a build-tree copy where the
          # smoke-legacy-entry subprocess (pkgload::load_all + visualization)
          # hangs after Step 4. Plain R CMD check is the acceptance gate
          # here (0 ERROR / 0 WARNING locally); this is not a CRAN
          # submission. See .github/workflows/R-CMD-check.yaml history.
          args: 'c("--no-manual")'
          upload-snapshots: true
          build_args: 'c("--no-build-vignettes", "--no-manual")'

      # R CMD check runs tests/testthat/ only -- it never touches the
      # standalone verify_*.R scripts. Until 2026-08-09 those four scripts had
      # to be remembered and run by hand, so nothing enforced them on push.
      #
      # verify_reference_fidelity.R runs in --strict mode: a metric with no
      # recorded comparison against the 2026-05-19 baseline fails the build.
      # That is the gate B1 lacked; it went unnoticed for three months and
      # shifted mean TST by about 29 minutes.
      #
      # verify_v1_3_snapshot.R is not listed: it needs the configured input
      # data, which is real participant data and is never committed.
      - name: Structural verification (standalone scripts)
        run: |
          Rscript verify_finalize_columns.R
          Rscript verify_reference_fidelity.R --strict
          Rscript verify_delivery_wiring.R --dir output
        shell: bash
