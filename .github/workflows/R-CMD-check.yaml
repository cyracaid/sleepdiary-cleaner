# R CMD check via GitHub Actions
# Runs on every push and PR to ensure package integrity
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

jobs:
  R-CMD-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # DESCRIPTION says R (>= 4.4). Until 2026-11-04 no job ever ran that
        # floor: the matrix was OS-only and setup-r installs the release
        # version. The floor is checked on one OS only -- the oldest R has no
        # current binaries on the other two, so a full 3x2 matrix would spend
        # most of its time compiling packages to test the platform we already
        # cover. Lower floors were tried and failed: 4.2 writes midnight times
        # as "00:00:00" where 4.3 and later write the date only (6 golden-table
        # failures), and 4.3.3 moves a time inside the spring-forward gap an
        # hour earlier (2 tests). 4.4 passes both.
        r: [release]
        include:
          - os: ubuntu-latest
            r: '4.4'
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::yaml
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          # error-on is injected literally into R code (error_on = (${{ inputs.error-on }}))
          # so the value must carry quotes: '"error"' -> error_on = ("error").
          # The pre-fix error_on key was invalid input, dropped, defaulting to
          # error-on: "warning" -> every WARNING red since 2d698b9.
          error-on: '"error"'
          # Drop --as-cran: it runs tests in a build-tree copy where the
          # smoke-legacy-entry subprocess (pkgload::load_all + visualization)
          # hangs after Step 4. Plain R CMD check is the acceptance gate
          # here (0 ERROR / 0 WARNING locally); this is not a CRAN
          # submission. See .github/workflows/R-CMD-check.yaml history.
          # Build the vignettes in the build step (do NOT pass --no-build-vignettes).
          # With it the tarball has no inst/doc, and R CMD check then warns
          # "Files in the 'vignettes' directory but no files in 'inst/doc'" and
          # "Directory 'inst/doc' does not exist" even though the package is fine
          # (seen in every job of run 40822693139). CRAN builds the tarball with
          # vignettes, so CI should too. knitr/rmarkdown are in Suggests.
          args: 'c("--no-manual")'
          upload-snapshots: true
          build_args: 'c("--no-manual")'

      # R CMD check runs tests/testthat/ only -- it never touches the
      # standalone verify_*.R scripts. Until 2026-08-09 those four scripts had
      # to be remembered and run by hand, so nothing enforced them on push.
      #
      # verify_reference_fidelity.R runs in --strict mode: a metric with no
      # recorded comparison against the 2026-05-19 baseline fails the build.
      # That is the gate B1 lacked; it went unnoticed for three months and
      # shifted mean TST by about 29 minutes.
      #
      # verify_v1_3_snapshot.R is not listed: it needs the configured input
      # data, which is real participant data and is never committed.
      - name: Structural verification (standalone scripts)
        run: |
          Rscript verify_finalize_columns.R
          Rscript verify_reference_fidelity.R --strict
          Rscript verify_delivery_wiring.R --dir output
        shell: bash
