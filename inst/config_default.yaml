# sleepcleanr Pipeline Configuration
# =============================================================================
# This config drives the study dataset. For your OWN data, copy
# inst/config_template.yaml -> my_study.yaml and edit the "data" section.
#
# Quick start: library(sleepcleanr); run_pipeline(config = "my_study.yaml")
# =============================================================================

pipeline:
  name: "Sleep EMA Data Cleaning Pipeline"
  version: "1.0.0"

# =============================================================================
# DATA FILES
# =============================================================================
data:
  # What kind of data this is: "real" (participant data; figures go under
  # output/, which is gitignored), "synth" (synthetic or test data) or
  # "unknown". It is never guessed: when empty, an interactive run asks
  # (r / s / n) and a non-interactive run that makes figures stops with an
  # error. Runs with skip_visualization = TRUE do not need it.
  tag: ""
  files:
    main: "your_data.rds"
    # -- Your main sleep diary file. Accepts .rds (R data) or .csv (plain text).
    #   Required columns: pid, day_num, sleep time columns, SOL, WASO.
    #   Full contract: see SCHEMA.md
    #   NOTE: placeholder name. Configure your actual export filename locally;
    #   real data files are never committed to the repo.

    extra: "your_extra_data.csv"
    # -- Optional supplementary file. Leave "" if your main file already
    #   contains StartDate and num_waso_estimate_am.
    #   When provided: StartDate, num_waso (-> num_waso_am), num_waso_estimate_am
    #   are copied from this file into the main data.
    #   Row count must match the main file exactly.
    #   NOTE: placeholder name; configure your actual export filename locally.

    # Compatibility: the legacy keys main_rds / main_csv are still recognised
    # when no "main" or "extra" key is present. They will be removed in v2.0.

    manual_error: "manual_error_corrections.csv"
    manual_unusual: "manual_unusual_corrections.csv"
    manual_nap_exercise: "manual_nap_exercise_corrections.csv"
    manual_metric_duration: "manual_sleep_metric_duration_corrections.csv"
    manual_metric_accept: "manual_metric_review_acceptances.csv"
    second_review: "second_review_checklist.csv"

    # Private silent-error audit ledger (per pid/day/field decisions). Empty
    # (default) = ledger inactive and Dataset B's audit_disposition is "none".
    # When set, the file must exist or the run stops. Gitignored; never ship it.
    audit_dispositions: ""

# =============================================================================
# COLUMN MAPPING
# =============================================================================
# Maps pipeline-internal column names to your dataset's column names.
# For each entry: "pipeline_name": "your_column_name"
# 
# If your dataset already uses the pipeline names, keep them as-is.
# If a column doesn't exist in your data, set to null or omit.
# =============================================================================
column_mapping:
  identifiers:
    pid: "pid"
    day_num: "day_num"
    row_id: "row_id"
    participant: "participant"
    study_day: "study_day"
    date_bed: "StartDate"

  # Timestamp columns (raw, before parsing)
  # These are the HH:MM and AM/PM pairs from the EMA diary.
  timestamp:
    time_bed_hhmm: "time_bed_am_hhmm"
    time_bed_ampm: "time_bed_am_ampm"
    time_sleep_hhmm: "time_sleep_am_hhmm"
    time_sleep_ampm: "time_sleep_am_ampm"
    time_awake_hhmm: "time_awake_am_hhmm"
    time_awake_ampm: "time_awake_am_ampm"
    time_getup_hhmm: "time_getup_am_hhmm"
    time_getup_ampm: "time_getup_am_ampm"

  # Duration columns (raw, as reported by participants)
  duration:
    sol: "duration_totalmin_sol_estimate_am"
    waso: "duration_totalmin_waso_estimate_am"
    nap: "duration_totalmin_napstoday_PM"
    exercise_light: "exercisetoday_PM_totalmin_Light"
    exercise_moderate: "exercisetoday_PM_totalmin_Moderate"
    exercise_vigorous: "exercisetoday_PM_totalmin_Vigorous"
    exercise_strength: "exercisetoday_PM_totalmin_Strength"

  # WASO count (number of wake bouts)
  waso_count: "num_waso_estimate_am"

  # Substance use columns
  substance:
    caffeine: "caffeinetoday_PM_NumCaffeinatedDrinksSnacks_1"
    alcohol: "alcoholtoday_PM_NumAlcoholicDrinks_1"
    nicotine: "nicotine_amount_pm_doses"
    nicotine_pm: "nicotine_amount_pm"
    cannabis: "cannabis_amount_pm_doses"

  # Corrected timestamp columns (produced by pipeline Steps 2-4)
  # These are created internally; map to null
  corrected_timestamp:
    time_bed: "time_bed_corrected"
    time_sleep: "time_sleep_corrected"
    time_awake: "time_awake_corrected"
    time_getup: "time_getup_corrected"

  # Computed metric columns (produced by pipeline Step 7)
  metric:
    tst: "self_diffcalc_totalsleeptime_minutes"
    sol: "self_diffcalc_sol_minutes"
    se: "self_diffcalc_sleepefficiency_percent"
    tib: "self_diffcalc_timeinbed_minutes"
    sleep_period: "self_diffcalc_sleepperiod_minutes"
    total_try_sleep: "self_diffcalc_totaltrysleep_minutes"
    waso_used: "duration_totalmin_waso_estimate_am_mincalc_used"
    waso_checkforerrors: "duration_totalmin_waso_estimate_am_checkforerrors"

  # Derived visualization columns (produced by apply_sleep_metrics)
  derived:
    sleep_duration_h: "sleep_duration_h"
    sol_h: "sol_h"
    waso_h: "waso_h"
    sleep_efficiency_pct: "sleep_efficiency_pct"
    time_in_bed_h: "time_in_bed_h"

  # Classification columns
  classification:
    data_category: "data_category"
    error_type: "error_type"
    unusual_type: "unusual_type"
    has_na: "has_na"
    manually_corrected: "manually_corrected"
    is_priority_adjusted: "is_priority_adjusted"
    minor_order_error: "minor_order_error"
    flag_severity: "flag_severity"
    flag_poor_efficiency: "flag_poor_efficiency"
    flag_high_sol: "flag_high_sol"
    flag_high_waso: "flag_high_waso"
    flag_duration_extreme: "flag_duration_extreme"
    flag_issue_count: "flag_issue_count"

  # Auto-detection columns
  auto_detection:
    checkforerrors_suffix: "_checkforerrors"
    needs_review_flag: "needs_review_flag"
    auto_error_desc: "auto_error_desc"
    sol_category: "sol_category"
    se_category: "se_category"
    tst_tib_ratio_category: "tst_tib_ratio_category"
    metric_duration_input_category: "metric_duration_input_category"

# =============================================================================
# TIMESTAMP SETTINGS
# =============================================================================
timestamp:
  # Format of raw timestamp columns
  # Supported: "hh:mm AM/PM", "HH:MM", "HH:MM:SS", "HH.MM"
  input_format: "hh:mm AM/PM"

  # AM/PM settings (only relevant for "hh:mm AM/PM" format)
  ampm:
    enabled: true
    pm_keywords: ["PM", "pm", "P.M.", "p.m."]
    am_keywords: ["AM", "am", "A.M.", "a.m."]

  # Midnight handling
  # "next_day": timestamps < 6:00 AM are considered next day
  # "as_is": no adjustment
  midnight_handling: "next_day"

  # Sequence validation
  # Expected order: bed -> sleep -> awake -> getup
  sequence:
    expected_order: ["time_bed", "time_sleep", "time_awake", "time_getup"]
    max_gap_hours: 12  # gaps >= 12h trigger AM/PM flip

  # Interval format detection
  interval:
    max_plausible_minutes: 10000
    max_nap_minutes: 720       # 12 hours
    max_exercise_minutes: 360  # 6 hours

# =============================================================================
# REVIEW RULES (user-defined)
# =============================================================================
# These rules, and only these, decide what the review status table and the
# review verdict say. The pipeline applies them; it never changes them.
#
# Every row of review_status.csv gets one review_state:
#   needs_review      a person still has to look (fails the re-check after
#                     corrections, became an error after corrections, marked
#                     pending in the manual file, or a Step 8 flag when
#                     step8_flags_need_review is true)
#   incorporated      a manual decision was applied and the record passes
#   not_incorporated  no manual decision changed the record and it passes
review:
  # Final data_category values that mean "no longer needs a person". The review
  # status table reports a row as "now passes" when its final category is in
  # this list. You define it; the pipeline only applies it.
  clean_categories: ["clean", "equal_time_ok", "reasonable_unusual"]
  done_when:
    # The review is DONE when at most this many rows are needs_review.
    max_needs_review: 0
  # true: a record that passes the re-check but carries a Step 8 flag is
  # needs_review. false: the flag is reported in its own column only.
  step8_flags_need_review: false
  # true: a record that is in a manual file but still has a time missing after
  # corrections (bed / sleep / wake / get-up left blank, so the order cannot be
  # re-checked) counts as incorporated. false: it stays needs_review.
  missing_times_ok_after_manual: false
  # true: stop the run with an error (after every output is written) when the
  # review is NOT DONE. Use this to make "done" a hard end point, e.g. in CI.
  fail_if_not_done: false
  # Suggested labels for metric flags (inst/scripts/generate_ai_review_csvs.R).
  # First matching rule wins. "<column>_matches" is a regular expression; any
  # other key lists the allowed values of that column. A suggestion is never a
  # decision: a row stays open until a person fills in human_decision.
  # "suggestions: []" turns suggestions off (every row gets suggestion_default).
  suggestions:
    - label: "likely_real_issue"
      when:
        auto_error_desc_matches: "SE:negative|TST/TIB:exceeds_1|SOL:negative"
      reason: "Mathematically impossible sleep metric (negative SE, TST/TIB > 1, or negative SOL); likely needs timestamp or WASO/TST review."
    - label: "likely_false_positive"
      when:
        sol_category: ["excessive"]
        se_category: ["valid"]
        tst_tib_ratio_category: ["normal", "normal_low"]
      reason: "SOL exceeds 120 min, but other sleep metrics are internally plausible; likely real long sleep latency rather than input error."
  suggestion_default:
    label: "needs_human"
    reason: "Metric flag needs human review because the values are unusual but not automatically classifiable from available fields."

# =============================================================================
# SECOND REVIEW
# =============================================================================
second_review:
  # A second-review row needs a numeric pid and day_num to identify a record. If
  # a row does not have them (for example free text ended up in those columns):
  #   skip : leave the row out, list it on the console and in
  #          output/second_review_rows_skipped.csv, and carry on
  #   stop : stop the run with the line numbers so the file can be corrected
  on_invalid_rows: skip

# =============================================================================
# MANUAL CORRECTIONS
# =============================================================================
manual_corrections:
  # When a manual sleep-metric-duration row and the interval parser disagree
  # (the parser already converted an MM:SS value), which one is used?
  #   false : the parser (long-standing behaviour); the manual row is listed in
  #           output/manual_corrections_not_applied.csv
  #   true  : the manual row
  manual_overrides_parser: false

# =============================================================================
# NORMALIZE SETTINGS
# =============================================================================
# Minor order-error correction (Step 4, Section 5 of normalize_sleep_time_sequence)
normalize:
  # Absolute gap (hours) below which an out-of-order pair (bed/sleep,
  # sleep/awake, awake/getup) is corrected by swapping the pair.
  # Larger violations are left untouched (genuinely unusual sleep patterns).
  swap_threshold_hours: 3

# =============================================================================
# CROSS-PARTICIPANT SETTINGS (Step 8.5)
# =============================================================================
# Per-metric spike detection against each participant's own baseline.
# Defaults reproduce the pre-config literals exactly (do not change them
# unless your study population needs different cutoffs).
cross_participant:
  min_days: 3
  default:
    min_baseline_for_spike: 5
    spike_multiplier: 4
    low_baseline_median_lt: 15
    low_baseline_value_gt: 180
  metrics:
    subjective_sol:
      spike_abs_threshold: 120
      low_baseline_median_lt: 30
      low_baseline_value_gt: 240
    waso:
      min_baseline_for_spike: 3
      spike_abs_threshold: 60
      low_baseline_median_lt: 15
      low_baseline_value_gt: 120
    nap:
      spike_abs_threshold: 360
      low_baseline_median_lt: 10
      low_baseline_value_gt: 360
    exercise_light:
      spike_abs_threshold: 240
      low_baseline_median_lt: 15
      low_baseline_value_gt: 270
    exercise_moderate:
      spike_abs_threshold: 180
      low_baseline_median_lt: 10
      low_baseline_value_gt: 210
    exercise_vigorous:
      spike_abs_threshold: 120
      low_baseline_median_lt: 5
      low_baseline_value_gt: 180
    exercise_strength:
      spike_abs_threshold: 120
      low_baseline_median_lt: 5
      low_baseline_value_gt: 150

# =============================================================================
# CLASSIFICATION THRESHOLDS
# =============================================================================
classification:
  # Which records go to the human-review worksheets (Step 5), and the same rules
  # when the data are rechecked after manual corrections (Step 6). All values are
  # hours. Defaults are the long-standing rules; change them to fit your study.
  step5:
    error:                                  # a record matching any of these is an ERROR
      bed_to_sleep_max_hours: 7             # |sleep - bed| above this
      awake_to_getup_max_hours: 7           # |getup - awake| above this
      sleep_to_awake_max_hours: 24          # |awake - sleep| above this
    unusual:                                # suspicious but possible: UNUSUAL
      sleep_to_awake_min_hours: 3           # sleep period below this
      sleep_to_awake_max_hours: 15          # sleep period above this
      bed_to_sleep_max_hours: 3             # sleep - bed above this
      awake_to_getup_max_hours: 3           # getup - awake above this

  # Sleep metric validation (Part C auto-detection)
  metric_validation:
    sol:
      excessive_minutes: 120               # SOL > 2h -> flag (lenient; clinical cutoff ~30min. rationale: see THRESHOLDS.md)
      negative: true                       # SOL < 0 -> flag
      window_tolerance_minutes: 15         # SOL > bed->sleep window + tol -> flag (parse/rounding noise floor)
    se:
      min_valid_percent: 0                 # SE < 0 -> flag
      max_valid_percent: 100               # SE > 100 -> flag
      insane_negative_percent: -1000       # SE < -1000 -> insane flag
    tst_tib_ratio:
      min_ratio: 0.5                       # TST/TIB < 0.5 -> flag
      max_ratio: 1.0                       # TST/TIB > 1.0 -> flag
    waso:
      excessive_hours: 1.5                 # WASO > 1.5h

  # Flag severity (for figures)
  flag_severity:
    poor_efficiency_threshold_pct: 70      # SE < 70% -> flag (lenient; clinical insomnia cutoff ~85%. rationale: see THRESHOLDS.md)
    high_sol_threshold_hours: 1            # SOL > 1h -> flag (lenient; clinical marker ~30min. rationale: see THRESHOLDS.md)
    high_waso_threshold_hours: 1.5         # WASO > 1.5h -> flag (lenient; clinical marker ~30min. rationale: see THRESHOLDS.md)

  # Categories
  categories:
    clean: "clean"
    error: "error"
    unusual: "unusual"
    equal_time_ok: "equal_time_ok"
    skipped_na: "skipped_na"
    reasonable_unusual: "reasonable_unusual"

  # Auto-detection category labels
  auto_detection_categories:
    timestamp_issue: "TIMESTAMP_ISSUE"
    duration_issue: "DURATION_ISSUE"
    amount_flag: "AMOUNT_FLAG"
    self_reported_flag: "SELF_REPORTED_FLAG"
    clean: "CLEAN"
    clean_manually_fixed: "CLEAN (Manually Fixed)"
    still_fails_manually_corrected: "STILL FAILS (Manually Corrected)"
    not_checkable_manually_corrected: "NOT CHECKABLE (Manually Corrected)"

# =============================================================================
# OUTPUT SETTINGS
# =============================================================================
output:
  figure:
    # Base directory for CONFIRMED-real-data figure runs only (data_tag == "real").
    # "output" keeps real-data figures with the delivered datasets; set to
    # anything (e.g. ".") to place them elsewhere.
    root_dir: "output"
    # Base directory for synthetic/test runs AND for runs whose data_tag could
    # not be determined ("unknown"). Empty string = project root. This is a
    # fail-closed default: only a run positively tagged "real" is trusted with
    # output/ (gitignored, treated as containing participant data). "unknown"
    # is routed here on purpose, not into output/ -- see figure_run_dir() in
    # R/config.R for why.
    #
    # NOTE: moving synth/unknown runs out of output/ only prevents them from
    # overwriting real-data figures. It does NOT make them git-tracked --
    # .gitignore's `latest_visualization*/` pattern has no path anchor, so it
    # matches this directory wherever it lands, output/ or not. If you need a
    # synth run committed for CI/reviewer reference, give it its own path that
    # isn't caught by that pattern.
    synth_root_dir: ""
    width_inches: 14
    height_inches: 9
    dpi: 150
    subfolders:
      pipeline_cleaning: "pipeline_cleaning"
      research_ready: "research_ready"
  report:
    dir: "output"
    correction_status: "correction_status.csv"
    correction_status_final: "correction_status_final.csv"
    flagged_self_reported: "flagged_records_self_reported.csv"
  review:
    # One status table for both Step 5 worksheets (project root, overwritten
    # every run) and one run log that gets one line per run (never a new file).
    status_file: "review_status.csv"
    run_log: "review_runs.csv"     # written under output.report.dir

# =============================================================================
# VISUALIZATION OPTIONS
# =============================================================================
# Revised 2026-09-02: swap_injection_test and threshold_noise's ORIGINAL
# blocks were dropped first (13C read a CSV nothing in this repo generated;
# 13D duplicated the Bland-Altman advisory plot already produced a few
# hundred lines earlier in sleep_visualization.R, with a schema that didn't
# match validate_thresholds()'s real output). Both are now back, rebuilt on
# real data: 13C (renamed detection_outcomes) reads the synthetic benchmark
# harness's actual, git-tracked output
# (validation/synthetic/results/detection_outcomes_v4.csv -- see
# validation/synthetic/README_results.md); 13D (threshold_noise) reuses the
# .ba_result already computed earlier in sleep_visualization.R via
# validate_thresholds() -- no recomputation, no reimplementation. See
# inst/scripts/sleep_visualization.R's Figure 13B/13C/13D comment blocks and
# 2026-09-04_work_log.md for the full audit trail.
visualization:
  # Figure 13B: Adjacent timestamp gap distribution (raw, pre-correction).
  # The 3-6h negative-gap band it highlights is a locked definition (see
  # validation/derive_timegap_candidates.R), not configurable from here --
  # there is deliberately no thresholds_to_show/pairs key below any more.
  gap_analysis:
    enabled: true

  # Figure 13C: Synthetic error-injection detection-outcome heatmap, from
  # validation/synthetic/results/detection_outcomes_v4.csv. Skips gracefully
  # (prints a warning, doesn't error) if that file isn't present -- e.g. the
  # benchmark harness hasn't been (re-)run in this checkout.
  detection_outcomes:
    enabled: true

  # Figure 13D: Cleaning thresholds vs Bland-Altman measurement-noise ratio.
  # Reuses the .ba_result computed earlier in this script; skips gracefully
  # if corrected_ema_data wasn't available or validate_thresholds() failed.
  threshold_noise:
    enabled: true
